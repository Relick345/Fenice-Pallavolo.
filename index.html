<style>
  :root{
    /* Colori presi dal logo Fenice: giallo -> arancio -> rosso corallo */
    --yellow:#F9D13E; --orange:#F58426; --red:#E23B2B; --red-dark:#C42E1F;
    --flame-gradient: linear-gradient(90deg, var(--yellow), var(--orange), var(--red));
    --title-gradient: linear-gradient(90deg, var(--orange), var(--red));
    --primary: var(--orange);
    --accent:#DD5518;        /* arancio scuro per le scritte (colore unico, niente sfumatura) */
    --on-orange:#261205;     /* testo scuro sopra giallo/arancio */
    --bg:#f8f5f1; --card:#ffffff; --card-2:#fdf3e8; --text:#231a14; --text-soft:#6a5b4e; --border:#eddfd2;
    --green:#28a745; --warn:#F9D13E; --danger:#dc3545;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#100d0b; --card:#1c1714; --card-2:#272019; --text:#f7ede2; --text-soft:#c7b4a2; --border:#3a2d22; --accent:#FF9A4D;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#100d0b; --card:#1c1714; --card-2:#272019; --text:#f7ede2; --text-soft:#c7b4a2; --border:#3a2d22; --accent:#FF9A4D;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:14px;
    padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transition:background .3s ease, color .3s ease;}

  /* ---------- Intestazione ---------- */
  .brand-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-top:2px;animation:fadeInUp .5s ease both}
  .brand-row img{height:84px;width:auto;max-width:80%;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
  h1{text-align:center;margin:0;font-size:1.6rem;background:var(--title-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-weight:900;letter-spacing:.5px}
  .divider{max-width:1100px;height:4px;border-radius:4px;background:var(--flame-gradient);margin:10px auto 8px}
  @keyframes popIn{ from{opacity:0;transform:scale(.6) rotate(-8deg)} to{opacity:1;transform:scale(1) rotate(0)} }
  .sub-sync{text-align:center;font-size:.76rem;color:var(--text-soft);margin-bottom:12px}

  /* ---------- Barra utente ---------- */
  .top-bar{max-width:1100px;margin:0 auto 12px;background:var(--card);padding:10px 14px;border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    transition:background .3s ease;animation:fadeInUp .45s ease .05s both}
  .filters{animation:fadeInUp .45s ease .1s both}
  .status-badge{font-size:.82rem;padding:5px 12px;border-radius:20px;background:var(--card-2);color:var(--text)}
  .status-verified{background:#d4edda;color:#155724;font-weight:bold}
  .status-unverified{background:#f8d7da;color:#721c24}
  .status-warning{background:#fff3cd;color:#856404;font-weight:bold}

  button{cursor:pointer;border:none;border-radius:10px;font-weight:bold;font-size:.85rem;padding:10px 14px;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease; -webkit-tap-highlight-color:transparent;}
  button:active{transform:scale(.95)}
  .btn-primary{background:var(--orange);color:var(--on-orange);box-shadow:0 3px 10px rgba(245,132,38,.3)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:var(--green);color:#fff}
  .btn-warning{background:var(--yellow);color:var(--on-orange)}
  .btn-theme{background:var(--card-2);color:var(--text);font-size:1.05rem;padding:8px 11px;border:1px solid var(--border)}
  #auth-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ---------- Filtri ---------- */
  .filters{max-width:1100px;margin:0 auto 14px;background:var(--card);padding:12px 14px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  .chip{padding:7px 15px;border-radius:20px;background:var(--card-2);color:var(--text);font-size:.83rem;font-weight:bold;
    cursor:pointer;user-select:none;border:2px solid var(--border);transition:transform .15s ease, background .2s ease;white-space:nowrap;flex:0 0 auto}
  .chip:active{transform:scale(.94)}
  .chip.active{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
  .chip.chip-all{background:#2b2420;border-color:#2b2420;color:#fff}
  .chip.chip-all.active{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
  .chip.chip-matita{background:transparent;border-style:dashed;color:var(--accent)}
  .chip.chip-edit{display:inline-flex;align-items:center;gap:2px;padding:3px 4px}
  .chip.chip-edit button{background:transparent;color:var(--accent);font-size:1.2rem;line-height:1;padding:4px 9px;border-radius:14px}
  .chip.chip-edit button:disabled{opacity:.25}
  .chip.chip-edit span{padding:0 2px}
  .chips-actions{display:flex;gap:8px;margin-bottom:10px}
  .chips-actions button{flex:1}
  .search-row{display:flex;gap:8px}
  .search-row input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--card);color:var(--text)}
  .search-row input:focus{outline:2px solid var(--primary);outline-offset:1px}

  /* ---------- Pannello admin ---------- */
  #admin-panel{display:none;max-width:1100px;margin:0 auto 16px;background:var(--card);padding:16px;border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.1);border-left:6px solid var(--orange);animation:slideDown .35s ease}
  #admin-panel h3{margin-top:0;color:var(--accent);font-weight:800}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .form-grid input,.form-grid select{padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--card);color:var(--text);min-width:0}
  .campionato-wrap{display:flex;gap:4px}
  .campionato-wrap input{flex:1;min-width:0}
  .btn-scegli-campionato{padding:0 10px;background:var(--card-2);color:var(--accent);border:1px solid var(--border);border-radius:8px;font-weight:bold}
  #popup-campionati{position:fixed;z-index:999;display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);padding:8px;max-width:260px;max-height:240px;overflow-y:auto;animation:fadeInUp .15s ease}
  #popup-campionati .voce{padding:9px 10px;border-radius:6px;cursor:pointer;font-size:.9rem;color:var(--text)}
  #popup-campionati .voce:hover{background:var(--card-2);color:var(--accent)}
  .btn-full-width{grid-column:1/-1;margin-top:4px}

  /* ---------- Schede partita ---------- */
  .matches{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .match-card{background:var(--card);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;
    border-left:5px solid var(--orange);animation:fadeInUp .4s ease both; transition:transform .2s ease, box-shadow .2s ease;}
  .match-card.fuori{border-left-color:var(--red)}
  .match-card::after{content:"";display:block;height:4px;background:var(--flame-gradient)}
  .match-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}

  .match-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 2px;font-size:.8rem;color:var(--text-soft)}
  .camp-tag{background:var(--orange);color:var(--on-orange);padding:4px 11px;border-radius:12px;font-weight:800;font-size:.74rem;display:inline-block;white-space:nowrap}
  .when{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--text-soft);white-space:nowrap}
  .when .ora{color:var(--text);font-weight:800}

  .match-body{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px 14px 16px}
  .team{font-weight:800;font-size:1rem;line-height:1.2;text-align:center;overflow-wrap:anywhere;color:var(--text)}
  .team.noi{color:var(--accent)}
  .score{text-align:center;min-width:56px}
  .score .ris{display:inline-block;white-space:nowrap;font-size:1.5rem;font-weight:900;color:var(--text);
    border:2px solid var(--orange);border-radius:12px;padding:2px 12px}
  .score .vs{font-size:.8rem;font-weight:800;color:var(--text-soft);letter-spacing:1px}
  .tag-passata{display:block;margin-top:5px;color:#fff;background:var(--red-dark);font-size:.62rem;font-weight:800;padding:3px 8px;border-radius:9px;white-space:nowrap;animation:pulsaPiano 2s ease-in-out infinite}
  @keyframes pulsaPiano{ 0%,100%{opacity:1} 50%{opacity:.65} }

  .match-bottom{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 14px;padding:11px 0 14px;border-top:1px solid var(--border);font-size:.76rem;color:var(--text-soft)}
  .pill{padding:0;font-weight:800;font-size:.72rem;letter-spacing:.4px;white-space:nowrap}
  .pill.casa{color:var(--accent)}
  .pill.fuori{color:var(--red-dark)}
  :root[data-theme="dark"] .pill.fuori{color:#FF7A66}
  .via{flex-basis:100%;overflow-wrap:anywhere}

  .input-risultato{width:90px;padding:8px;border:1px solid var(--border);border-radius:8px;text-align:center;font-weight:bold;font-size:16px;background:var(--card);color:var(--text)}
  .action-buttons{display:flex;gap:6px;padding:10px 14px;background:var(--card-2);flex-wrap:wrap}
  .edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 14px}
  .edit-grid input,.edit-grid select{padding:9px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--card);color:var(--text);min-width:0}
  .empty{text-align:center;color:var(--text-soft);padding:40px 0}

  @keyframes fadeInUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideDown{ from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes spin{ to{transform:rotate(360deg)} }
  .spin{display:inline-block;animation:spin 1.2s linear infinite}

  /* ---------- Telefono ---------- */
  @media (max-width:600px){
    body{padding-left:10px;padding-right:10px}
    .brand-row img{height:68px}
    h1{font-size:1.35rem}
    .top-bar,.filters{padding:10px 12px}
    .top-bar{flex-direction:column;align-items:stretch}
    #user-status{text-align:center}
    #auth-actions{width:100%;flex-wrap:nowrap}
    #auth-actions > button:not(.btn-theme){flex:1}
    #pin-section{flex:1}
    #pin-section input{flex:1;min-width:0;width:auto !important;font-size:16px}
    /* categorie: una sola riga scorrevole, non occupano mezzo schermo */
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
    .chips::-webkit-scrollbar{display:none}
    .match-body{padding:10px 10px 14px;gap:6px}
    .match-bottom{margin:0 12px}
    .top-bar{padding:8px 10px;gap:6px}
    .brand-row img{height:60px}
    .divider{margin:8px auto 6px}
    .sub-sync{margin-bottom:8px}
    .filters{margin-bottom:10px}
    .team{font-size:.92rem}
    .score .ris{font-size:1.3rem;padding:3px 9px}
    .edit-grid,.form-grid{grid-template-columns:1fr 1fr}
    .action-buttons > button{flex:1}
    .action-buttons .input-risultato{width:100%;flex-basis:100%}
  }

  /* ---------- Chat, installazione, categorie nascoste ---------- */
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .chips-actions{flex-wrap:wrap}
  .hint{flex-basis:100%;margin:0;font-size:.75rem;color:var(--text-soft)}
  .chip svg{width:13px;height:13px;margin:-2px 5px -2px 0}
  .chip.nascosta{border-style:dashed;color:var(--text-soft);background:transparent}
  .chip.nascosta.active{background:var(--orange);color:var(--on-orange);border-style:solid}
  .chip.chip-edit.is-hidden{opacity:.55;border-style:dashed}
  .chip.chip-edit .eye{padding:4px 7px}
  .chip.chip-edit .eye svg{width:16px;height:16px;display:block;margin:0}
  .fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;width:56px;height:56px;border-radius:50%;padding:0;background:var(--orange);color:var(--on-orange);box-shadow:0 6px 18px rgba(226,59,43,.35);display:flex;align-items:center;justify-content:center}
  .fab svg{width:26px;height:26px}
  .fab .dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:.72rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
  .fab .dot[hidden]{display:none}
  .sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
  .sheet[hidden]{display:none}
  .sheet-card{width:100%;max-width:520px;max-height:88dvh;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:slideUp .28s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
  .sheet-head h3{flex:1;margin:0;font-size:1.05rem;color:var(--accent);font-weight:800}
  .sheet-head button{background:var(--card-2);color:var(--text);border:1px solid var(--border);padding:6px 11px;font-size:1rem}
  .sheet-body{overflow-y:auto;padding:4px 16px 14px;display:flex;flex-direction:column;gap:10px;min-height:150px;font-size:.92rem;line-height:1.45}
  .sheet-body p{margin:0}
  .sheet-body ol{margin:0;padding-left:20px;display:grid;gap:9px}
  .muted{color:var(--text-soft);font-size:.85rem}
  .msg{max-width:82%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg small{display:block;margin-top:3px;font-size:.66rem;opacity:.7}
  .msg.mio{align-self:flex-end;background:var(--orange);color:var(--on-orange);border-bottom-right-radius:5px}
  .msg.altro{align-self:flex-start;background:var(--card-2);border:1px solid var(--border);border-bottom-left-radius:5px}
  #chat-form{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--border)}
  #chat-form[hidden]{display:none}
  #chat-form textarea{flex:1;min-width:0;resize:none;padding:11px 14px;border:1px solid var(--border);border-radius:14px;font:inherit;font-size:16px;background:var(--card);color:var(--text);max-height:110px}
  .inbox-item{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--card-2);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:11px 13px}
  .inbox-item .tx{flex:1;min-width:0}
  .inbox-item span{display:block;font-weight:400;color:var(--text-soft);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inbox-item .pt{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
  .install-banner{max-width:1100px;margin:0 auto 12px;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--orange);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.88rem;animation:fadeInUp .4s ease both}
  .install-banner[hidden]{display:none}
  .install-banner .row{display:flex;gap:8px}
  .install-banner .row button{flex:1}
  .btn-ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
  .link-btn{display:block;margin:-4px auto 10px;background:none;color:var(--accent);padding:4px 8px;font-size:.78rem;text-decoration:underline}
  .link-btn[hidden]{display:none}
</style>
</head>

// Tema chiaro/scuro con memoria della preferenza (solo su questo dispositivo)
const btnTheme = document.getElementById('btn-theme');
function applicaTema(t){
  if (t === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); btnTheme.textContent = '☀️'; }
  else { document.documentElement.setAttribute('data-theme','light'); btnTheme.textContent = '🌙'; }
}
try{
  const salvato = localStorage.getItem('fenice-tema');
  applicaTema(salvato || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
}catch(e){ applicaTema('light'); }
btnTheme.onclick = () => {
  const attuale = document.documentElement.getAttribute('data-theme');
  const nuovo = attuale === 'dark' ? 'light' : 'dark';
  applicaTema(nuovo);
  try{ localStorage.setItem('fenice-tema', nuovo); }catch(e){}
};

document.getElementById('btn-login').onclick = () => signInWithPopup(auth, provider);
document.getElementById('btn-logout').onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  const statusEl = document.getElementById('user-status');

    btnLogin.style.display = 'none';
    btnLogout.style.display = 'inline-block';
    adminPanel.style.display = 'none';
    if (EMAIL_VERIFICATE.includes(emailCorrente)) {
      isVerificato = true;
      pinSection.style.display = 'flex';
      statusEl.textContent = `🔒 In attesa di PIN (${emailCorrente})`;
      statusEl.className = "status-badge status-warning";
    } else {
      isVerificato = false;
      pinSection.style.display = 'none';
      statusEl.textContent = `⛔ Non autorizzato (${emailCorrente})`;
      statusEl.className = "status-badge status-unverified";
    }

async function leggiFoglioGoogle(forza=false){
  if (!forza && (modificaOrdine || rigaInModifica !== null || (document.activeElement && document.activeElement.classList.contains('input-risultato')))) return;
  try{
    const res = await fetch(URL_FOGLIO_GOOGLE + "?t=" + Date.now());
    const dati = await res.json();
    if (dati.status === "ok"){
      ordineCategorie = Array.isArray(dati.ordineCategorie) ? dati.ordineCategorie : [];
      const nuovoJson = JSON.stringify([dati.partite, ordineCategorie]);
      if (forza || nuovoJson !== ultimoJson){
        ultimoJson = nuovoJson;
        partiteCache = dati.partite;
        disegnaTutto();
      }
      if (!/^v[34]/.test(dati.versione || "")) {
        document.getElementById('sync-indicator').textContent = "⚠️ Lo script collegato è una versione VECCHIA (orari non corretti). Rifai la distribuzione in Apps Script.";
      } else {
        document.getElementById('sync-indicator').textContent = "✅ In diretta · aggiornato alle " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      }
    }
  }catch(err){ console.error("Errore lettura Foglio Google:", err); }
}

function partitaPassata(p){
  return parseDataOra(p.Giorno, p.Ora).getTime() < Date.now();
}

function parseDataOra(giorno, ora){
  const pg = (giorno||"").split("/");
  const po = (ora||"0:0").replace(".",":").split(":");
  if (pg.length !== 3) return new Date(8640000000000000);
  return new Date(parseInt(pg[2]), parseInt(pg[1])-1, parseInt(pg[0]), parseInt(po[0]||0), parseInt(po[1]||0));
}

function categorieOrdinate(){
  const tutte = [...new Set(partiteCache.map(p => p.Campionato).filter(Boolean))];
  return tutte.sort((x, y) => {
    const ix = ordineCategorie.indexOf(x), iy = ordineCategorie.indexOf(y);
    if (ix === -1 && iy === -1) return x.localeCompare(y);
    if (ix === -1) return 1;
    if (iy === -1) return -1;
    return ix - iy;
  });
}

function disegnaChips(){
  const categorie = categorieOrdinate();

  // Suggerimenti per il campo "Campionato" nei form (categorie gia' esistenti)
  const datalist = document.getElementById('elenco-campionati');
  datalist.innerHTML = categorie.map(c => `<option value="${escapeHtml(c)}"></option>`).join('');

  const cont = document.getElementById('chips-categorie');
  cont.innerHTML = "";
  const azioni = document.getElementById('chips-azioni');
  if (azioni) azioni.remove();
  const admin = isVerificato && isSbloccato;

  // ---- modalita' riordino (solo admin) ----
  if (admin && modificaOrdine){
    // aggiunge eventuali categorie nuove in fondo alla bozza, toglie quelle sparite
    ordineBozza = ordineBozza.filter(c => categorie.includes(c)).concat(categorie.filter(c => !ordineBozza.includes(c)));
    ordineBozza.forEach((cat, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip chip-edit' + (nascosteBozza.includes(cat) ? ' is-hidden' : '');
      chip.innerHTML = `<button type="button" ${i===0?'disabled':''} aria-label="Sposta prima">‹</button><span>${escapeHtml(cat)}</span><button type="button" ${i===ordineBozza.length-1?'disabled':''} aria-label="Sposta dopo">›</button><button type="button" class="eye" aria-label="Mostra o nascondi">${nascosteBozza.includes(cat) ? ICON_OFF : ICON_ON}</button>`;
      const [bSu, bGiu, bOcchio] = chip.querySelectorAll('button');
      bSu.onclick = () => { [ordineBozza[i-1], ordineBozza[i]] = [ordineBozza[i], ordineBozza[i-1]]; disegnaChips(); };
      bGiu.onclick = () => { [ordineBozza[i+1], ordineBozza[i]] = [ordineBozza[i], ordineBozza[i+1]]; disegnaChips(); };
      bOcchio.onclick = () => { nascosteBozza = nascosteBozza.includes(cat) ? nascosteBozza.filter(c => c !== cat) : nascosteBozza.concat(cat); disegnaChips(); };
      cont.appendChild(chip);
    });
    const box = document.createElement('div');
    box.id = 'chips-azioni'; box.className = 'chips-actions';
    box.innerHTML = `<p class="hint">Con l’occhio nascondi una categoria da «Tutte»: si vede solo toccandola.</p><button type="button" class="btn-success">✔ Salva ordine</button><button type="button" class="btn-danger">✖ Annulla</button>`;
    const [bSalva, bAnnulla] = box.querySelectorAll('button');
    bSalva.onclick = async () => {
      try{ await setDoc(doc(db,'config','vista'), { nascoste: nascosteBozza }); categorieNascoste = nascosteBozza.slice(); }
      catch(e){ alert('Categorie nascoste non salvate: controlla le regole Firebase.'); }
      await inviaAlFoglio({ azione:"salva_ordine_categorie", ordine: ordineBozza });
      modificaOrdine = false; disegnaTutto();
    };
    bAnnulla.onclick = () => { modificaOrdine = false; disegnaTutto(); };
    cont.after(box);
    return;
  }

  // ---- modalita' normale ----
  const chipTutte = document.createElement('span');
  chipTutte.className = 'chip chip-all' + (tutteAttivo ? ' active' : '');
  chipTutte.textContent = 'Tutte';
  chipTutte.onclick = () => { tutteAttivo = !(tutteAttivo && categorieSelezionate.size > 0); disegnaTutto(); };
  cont.appendChild(chipTutte);

  categorie.forEach(cat => {
    const chip = document.createElement('span');
    const nascosta = categorieNascoste.includes(cat);
    chip.className = 'chip' + (categorieSelezionate.has(cat) ? ' active' : '') + (nascosta ? ' nascosta' : '');
    chip.innerHTML = (nascosta ? ICON_OFF : '') + escapeHtml(cat);
    chip.onclick = () => {
      if (tutteAttivo && categorieSelezionate.size === 0) { tutteAttivo = false; categorieSelezionate.add(cat); }
      else if (categorieSelezionate.has(cat)) { categorieSelezionate.delete(cat); if (categorieSelezionate.size === 0) tutteAttivo = true; }
      else categorieSelezionate.add(cat);
      disegnaTutto();
    };
    cont.appendChild(chip);
  });

  if (admin){
    const matita = document.createElement('span');
    matita.className = 'chip chip-matita';
    matita.textContent = '✏️';
    matita.title = 'Cambia l\'ordine delle categorie';
    matita.onclick = () => { ordineBozza = categorie.slice(); nascosteBozza = categorieNascoste.slice(); modificaOrdine = true; disegnaChips(); };
    cont.appendChild(matita);
  }

// Autoformattazione dei campi Giorno (gg/mm/aaaa) e Ora (hh:mm):
// mette gli "/" e i ":" automaticamente mentre scrivi, e se esci dal
// campo Ora avendo scritto solo "17" lo completa in "17:00".
// Funziona sia sul form "Aggiungi partita" sia sulle righe in modifica
// (create dinamicamente) grazie alla delega sugli eventi del document.
// Riposiziona il cursore dopo aver ricostruito il testo con gli / o i :
// (senza questo, modificare una cifra in mezzo alla data "sballava" il
// cursore e bisognava riscrivere tutto da capo).
function riposizionaCursore(el, out, cifrePrimaDelCursore){
  let pos = 0, contate = 0;
  while (pos < out.length && contate < cifrePrimaDelCursore){
    if (/\d/.test(out[pos])) contate++;
    pos++;
  }
  el.setSelectionRange(pos, pos);
}
function formattaCampoData(el){
  const posCursore = el.selectionStart ?? el.value.length;
  const cifrePrimaDelCursore = el.value.slice(0, posCursore).replace(/\D/g, '').length;
  const cifre = el.value.replace(/\D/g, '').slice(0, 8);
  let out = cifre;
  if (cifre.length > 4) out = cifre.slice(0,2) + '/' + cifre.slice(2,4) + '/' + cifre.slice(4);
  else if (cifre.length > 2) out = cifre.slice(0,2) + '/' + cifre.slice(2);
  el.value = out;
  riposizionaCursore(el, out, cifrePrimaDelCursore);
}
function formattaCampoOra(el){
  const posCursore = el.selectionStart ?? el.value.length;
  const cifrePrimaDelCursore = el.value.slice(0, posCursore).replace(/\D/g, '').length;
  const cifre = el.value.replace(/\D/g, '').slice(0, 4);
  let out = cifre;
  if (cifre.length > 2) out = cifre.slice(0,2) + ':' + cifre.slice(2);
  el.value = out;
  riposizionaCursore(el, out, cifrePrimaDelCursore);
}
function completaCampoOra(el){
  let v = el.value.trim();
  if (/^\d{1,2}$/.test(v)) v = v.padStart(2,'0') + ':00';
  else if (/^\d{1,2}:\d{1}$/.test(v)) { const [h,m] = v.split(':'); v = h.padStart(2,'0') + ':' + m + '0'; }
  el.value = v;
}
document.addEventListener('input', (e) => {
  const id = e.target.id || '';
  if (id === 'nuovo-giorno' || id.startsWith('edit-giorno-')) formattaCampoData(e.target);
  if (id === 'nuova-ora' || id.startsWith('edit-ora-')) formattaCampoOra(e.target);
});
document.addEventListener('focusout', (e) => {
  const id = e.target.id || '';
  if (id === 'nuova-ora' || id.startsWith('edit-ora-')) completaCampoOra(e.target);
});

function segnaLetto(uid){
  if (sheetChat.hidden) return;
  const c = io ? aperta : mia;
  if (!c || !(io ? c.nonLettoAdmin : c.nonLettoUtente)) return;
  if (io) c.nonLettoAdmin = false; else c.nonLettoUtente = false;
  updateDoc(doc(db,'chats',uid), io ? {nonLettoAdmin:false} : {nonLettoUtente:false}).catch(() => {});
}
function thread(uid, nome){
  chatTitolo.textContent = nome; chatForm.hidden = false; $('chat-back').hidden = !io; $('chat-del').hidden = !io;
  chatCorpo.innerHTML = '<p class="muted">Nessun messaggio: scrivi qui sotto.</p>';
  unsubThread = onSnapshot(query(collection(db,'chats',uid,'messaggi'), orderBy('at')), snap => {
    chatCorpo.innerHTML = snap.empty ? '<p class="muted">Nessun messaggio: scrivi qui sotto.</p>' : '';
    snap.forEach(d => {
      const m = d.data({serverTimestamps:'estimate'});
      const el = document.createElement('div');
      el.className = 'msg ' + ((m.da === 'admin') === io ? 'mio' : 'altro');
      el.innerHTML = `${escapeHtml(m.testo)}<small>${oraMsg(m.at)}</small>`;
      chatCorpo.appendChild(el);
    });
    chatCorpo.scrollTop = chatCorpo.scrollHeight;
    segnaLetto(uid);
  }, () => { chatCorpo.innerHTML = '<p class="muted">Chat non disponibile: controlla che Firestore e le regole siano attivi.</p>'; });
}

chatForm.onsubmit = async e => {
  e.preventDefault();
  const testo = chatInput.value.trim();
  if (!testo || !utente) return;
  const uid = io ? aperta.uid : utente.uid;
  chatInput.value = ''; chatInput.style.height = '';
  const ref = doc(db,'chats',uid), b = writeBatch(db);
  const riep = { ultimoTesto: testo.slice(0,120), ultimoAt: serverTimestamp() };
  if (io) b.set(ref, {...riep, nonLettoUtente:true, nonLettoAdmin:false}, {merge:true});
  else b.set(ref, {...riep, uid, nome: utente.displayName || utente.email.split('@')[0], email: utente.email, nonLettoAdmin:true}, {merge:true});
  b.set(doc(collection(ref,'messaggi')), { testo, da: io ? 'admin' : 'utente', at: serverTimestamp() });
  try{ await b.commit(); }catch(err){ chatInput.value = testo; alert('Messaggio non inviato. Riprova.'); }
};
chatInput.oninput = () => { chatInput.style.height = 'auto'; chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px'; };
$('fab-chat').onclick = () => { sheetChat.hidden = false; schermata(); };
$('chat-back').onclick = () => { aperta = null; schermata(); };
$('chat-del').onclick = async () => {
  if (!io || !aperta || !confirm('Eliminare questa conversazione?')) return;
  const uid = aperta.uid; chiudiThread();
  try{
    const msgs = await getDocs(collection(db,'chats',uid,'messaggi'));
    const b = writeBatch(db); msgs.forEach(d => b.delete(d.ref)); b.delete(doc(db,'chats',uid));
    await b.commit();
  }catch(err){ alert('Eliminazione non riuscita.'); }
  aperta = null; schermata();
};
document.addEventListener('click', e => {
  const s = e.target.closest('[data-chiudi]') ? e.target.closest('.sheet') : (e.target.classList.contains('sheet') ? e.target : null);
  if (s){ s.hidden = true; if (s === sheetChat) chiudiThread(); }
});
onAuthStateChanged(auth, u => {
  utente = u; io = !!u && (u.email || '').toLowerCase() === EMAIL_PROPRIETARIO; aperta = null; mia = null; inboxCache = [];
  if (unsubBadge){ unsubBadge(); unsubBadge = null; }
  badge(0);
  if (u){
    unsubBadge = io
      ? onSnapshot(query(collection(db,'chats'), orderBy('ultimoAt','desc')), sn => {
          inboxCache = sn.docs.map(d => ({uid:d.id, ...d.data()}));
          badge(inboxCache.filter(c => c.nonLettoAdmin).length);
          if (!sheetChat.hidden && !aperta) schermata();
        }, () => {})
      : onSnapshot(doc(db,'chats',u.uid), sn => { mia = sn.exists() ? sn.data() : null; badge(mia && mia.nonLettoUtente ? 1 : 0); }, () => {});
  }
  if (!sheetChat.hidden) schermata();
});

/* ======= Installazione come app: rileva dispositivo e browser, mostra i passaggi giusti ======= */
const UA = navigator.userAgent;
const IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ANDROID = /Android/.test(UA);
const BR = IN_APP ? 'inapp' : /EdgiOS|EdgA|Edg\//.test(UA) ? 'edge' : /OPR|OPiOS|OPT\//.test(UA) ? 'opera' : /SamsungBrowser/.test(UA) ? 'samsung' : /FxiOS|Firefox/.test(UA) ? 'firefox' : /CriOS|Chrome\//.test(UA) ? 'chrome' : 'safari';
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const NOMI_BR = {inapp:'browser integrato in un’altra app', edge:'Edge', opera:'Opera', samsung:'Samsung Internet', firefox:'Firefox', chrome:'Chrome', safari:'Safari'};
const DISPOSITIVO = IOS ? (/iPad/.test(UA) ? 'iPad' : 'iPhone') : ANDROID ? 'Android' : 'computer';
let promptInstall = null;

function passi(){
  if (BR === 'inapp') return ['Tocca i tre puntini o l’icona di condivisione dell’app che stai usando','Scegli «Apri nel browser» (o «Apri in Safari/Chrome»)','Da lì premi di nuovo «Installa l’app»'];
  if (IOS){
    if (BR === 'safari') return ['Tocca Condividi (il quadrato con la freccia verso l’alto) nella barra in basso','Scorri e scegli «Aggiungi alla schermata Home»','Conferma con «Aggiungi» in alto a destra'];
    if (BR === 'firefox') return ['Tocca il menu ≡ in basso','Scegli «Condividi», poi «Aggiungi alla schermata Home»','Conferma con «Aggiungi»'];
    return ['Tocca Condividi (quadrato con freccia) vicino alla barra degli indirizzi, o dal menu ···','Scegli «Aggiungi alla schermata Home»','Conferma con «Aggiungi»'];
  }
  if (ANDROID){
    if (BR === 'samsung') return ['Tocca il menu ☰ in basso a destra','Scegli «Aggiungi pagina a», poi «Schermata Home»','Conferma con «Aggiungi»'];
    if (BR === 'firefox') return ['Tocca il menu ⋮ in alto a destra','Scegli «Installa»','Conferma con «Aggiungi»'];
    return ['Tocca il menu ⋮ in alto a destra','Scegli «Installa app» (o «Aggiungi a schermata Home»)','Conferma con «Installa»'];
  }
  if (BR === 'safari') return ['Nel menu in alto apri File','Scegli «Aggiungi al Dock»','Conferma con «Aggiungi»'];
  if (BR === 'firefox') return ['Firefox da computer non permette di installare le app','Apri questa pagina con Chrome, Edge o Safari','Oppure salvala tra i preferiti con Ctrl+D'];
  return ['Nella barra degli indirizzi, a destra, clicca l’icona di installazione (monitor con freccia)','Se non la vedi, apri il menu ⋮ e scegli «Installa»','Conferma con «Installa»'];
}
function apriInstall(){
  if (promptInstall){ const p = promptInstall; promptInstall = null; p.prompt(); return; }
  $('inst-body').innerHTML = `<p class="muted">Rilevato: ${NOMI_BR[BR]} su ${DISPOSITIVO}</p><ol>${passi().map(t => `<li>${t}</li>`).join('')}</ol><p class="muted">Poi apri il calendario dall’icona sulla schermata Home, come una vera app.</p>`;
  $('sheet-install').hidden = false;
}
const CHIAVE_INST = 'fenice-install-prossimo';
const rinvia = () => { try{ localStorage.setItem(CHIAVE_INST, String(Date.now() + 14 * 864e5)); }catch(e){} };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstall = e; });
window.addEventListener('appinstalled', () => { try{ localStorage.setItem(CHIAVE_INST, '9e15'); }catch(e){} $('install-banner').hidden = true; $('btn-installa').hidden = true; });
if (!STANDALONE){
  $('btn-installa').hidden = false;
  $('btn-installa').onclick = apriInstall;
  $('inst-si').onclick = () => { $('install-banner').hidden = true; rinvia(); apriInstall(); };
  $('inst-no').onclick = () => { $('install-banner').hidden = true; rinvia(); };
  let prossimo = 0; try{ prossimo = +localStorage.getItem(CHIAVE_INST) || 0; }catch(e){}
  if ((IOS || ANDROID) && Date.now() >= prossimo) setTimeout(() => { $('install-banner').hidden = false; }, 2500);
  // manifest creato al volo (file unico): rende il sito installabile dove il browser lo permette
  (async () => {
    try{
      const img = new Image(); img.src = document.querySelector('link[rel="apple-touch-icon"]').href; await img.decode();
      const icons = [192, 512].map(n => { const c = document.createElement('canvas'); c.width = c.height = n; c.getContext('2d').drawImage(img, 0, 0, n, n); return { src: c.toDataURL('image/png'), sizes: n + 'x' + n, type: 'image/png', purpose: 'any' }; });
      const man = { name:'Fenice Roma Pallavolo · Calendario', short_name:'Calendario Fenice', start_url: location.href.split('#')[0], display:'standalone', background_color:'#f8f5f1', theme_color:'#F58426', icons };
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], {type:'application/manifest+json'}));
      document.head.appendChild(l);
    }catch(e){}
  })();
}

leggiFoglioGoogle(true);
setInterval(() => leggiFoglioGoogle(false), 5000);
