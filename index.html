<style>
  :root{
    /* Palette presa dal logo Fenice: giallo -> arancio -> rosso */
    --flame-yellow:#FFC20E; --flame-orange:#FF7A1A; --flame-red:#E2231A; --flame-red-dark:#B31712;
    --flame-gradient: linear-gradient(90deg, var(--flame-yellow), var(--flame-orange), var(--flame-red));
    --primary: var(--flame-orange); --primary-dark: var(--flame-red-dark);
    --bg:#f6f4f1; --card:#ffffff; --card-2:#fbf4ec; --text:#241a12; --text-soft:#6b5d50; --border:#eee0d4;
    --green:#28a745; --warn:#ffc107; --danger:#dc3545;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#15110d; --card:#231a13; --card-2:#2b2017; --text:#f6ece0; --text-soft:#c9b6a3; --border:#3a2c20;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15110d; --card:#231a13; --card-2:#2b2017; --text:#f6ece0; --text-soft:#c9b6a3; --border:#3a2c20;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:14px;
    padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transition:background .3s ease, color .3s ease;}

  .brand-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;animation:fadeInUp .5s ease both}
  .brand-row img{height:50px;width:auto;filter:drop-shadow(0 3px 8px rgba(226,35,26,.3));animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
  h1{text-align:center;margin:4px 0 0;font-size:1.5rem;background:var(--flame-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:.5px}
  @keyframes popIn{ from{opacity:0;transform:scale(.6) rotate(-8deg)} to{opacity:1;transform:scale(1) rotate(0)} }
  .sub-sync{text-align:center;font-size:.78rem;color:var(--text-soft);margin-bottom:14px}

  .top-bar{max-width:1100px;margin:0 auto 12px;background:var(--card);padding:10px 16px;border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    transition:background .3s ease;animation:fadeInUp .45s ease .05s both}
  .filters{animation:fadeInUp .45s ease .1s both}
  .status-badge{font-size:.82rem;padding:5px 12px;border-radius:20px;background:var(--card-2);color:var(--text)}
  .status-verified{background:#d4edda;color:#155724;font-weight:bold}
  .status-unverified{background:#f8d7da;color:#721c24}
  .status-warning{background:#fff3cd;color:#856404;font-weight:bold}

  button{cursor:pointer;border:none;border-radius:8px;font-weight:bold;font-size:.85rem;padding:9px 14px;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease; -webkit-tap-highlight-color:transparent;}
  button:active{transform:scale(.95)}
  .btn-primary{background:var(--flame-gradient);color:#fff;box-shadow:0 3px 10px rgba(226,35,26,.25)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:var(--green);color:#fff}
  .btn-warning{background:var(--warn);color:#000}
  .btn-theme{background:var(--card-2);color:var(--text);font-size:1.05rem;padding:8px 11px;border:1px solid var(--border)}
  #auth-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .filters{max-width:1100px;margin:0 auto 14px;background:var(--card);padding:14px 16px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  .chip{padding:7px 15px;border-radius:20px;background:var(--card-2);color:var(--primary);font-size:.83rem;font-weight:bold;
    cursor:pointer;user-select:none;border:2px solid transparent;transition:transform .15s ease, background .2s ease, color .2s ease}
  .chip:active{transform:scale(.94)}
  .chip.active{background:var(--flame-gradient);color:#fff;box-shadow:0 2px 8px rgba(226,35,26,.3)}
  .chip.chip-all{background:#333;color:#fff}
  .chip.chip-all.active{background:var(--flame-gradient)}
  .search-row{display:flex;gap:8px}
  .search-row input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:.95rem;background:var(--card);color:var(--text)}
  .search-row input:focus{outline:2px solid var(--primary);outline-offset:1px}

  #admin-panel{display:none;max-width:1100px;margin:0 auto 16px;background:var(--card);padding:16px;border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.1);border-left:5px solid var(--primary);animation:slideDown .35s ease}
  #admin-panel h3{margin-top:0;background:var(--flame-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .form-grid input,.form-grid select{padding:9px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;background:var(--card);color:var(--text)}
  .btn-full-width{grid-column:1/-1;margin-top:4px}

  .matches{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .match-card{background:var(--card);border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);overflow:hidden;
    border-bottom:4px solid transparent;border-image:var(--flame-gradient) 1;
    animation:fadeInUp .4s ease both; transition:transform .2s ease, box-shadow .2s ease;}
  .match-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .match-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--card-2);font-size:.78rem;color:var(--text-soft);flex-wrap:wrap;gap:6px}
  .match-top .camp-tag{background:var(--flame-gradient);color:#fff;padding:3px 10px;border-radius:12px;font-weight:bold;font-size:.7rem;margin-right:6px;display:inline-block}
  .match-body{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;gap:10px;flex-wrap:wrap}
  .team{flex:1;min-width:130px;font-weight:bold;font-size:.95rem;display:flex;align-items:center;gap:8px;color:var(--text)}
  .team.casa{color:var(--flame-orange)}
  .team.trasferta{color:var(--flame-red);justify-content:flex-end;text-align:right}
  .score{text-align:center;min-width:100px}
  .score .ris{font-size:1.6rem;font-weight:800;background:var(--flame-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score .daplay{font-size:.85rem;font-weight:800;color:var(--text-soft);letter-spacing:.5px}
  .match-bottom{padding:8px 16px;border-top:1px solid var(--border);font-size:.76rem;color:var(--text-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .via{max-width:70%}
  .input-risultato{width:90px;padding:7px;border:1px solid var(--border);border-radius:6px;text-align:center;font-weight:bold;background:var(--card);color:var(--text)}
  .action-buttons{display:flex;gap:6px;padding:10px 16px;background:var(--card-2);flex-wrap:wrap}
  .edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 16px}
  .edit-grid input,.edit-grid select{padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;background:var(--card);color:var(--text)}
  .empty{text-align:center;color:var(--text-soft);padding:40px 0}

  @keyframes fadeInUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideDown{ from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes spin{ to{transform:rotate(360deg)} }
  .spin{display:inline-block;animation:spin 1.2s linear infinite}

  @media (max-width:600px){
    h1{font-size:1.25rem}
    .brand-row img{height:38px}
    .top-bar,.filters{padding:10px 12px}
    .match-body{padding:14px}
    .team{font-size:.88rem;min-width:100px}
    .score .ris{font-size:1.3rem}
    #auth-actions{width:100%;justify-content:space-between}
  }
</style>
</head>

  <h1>Calendario Fenice</h1>

<div class="sub-sync" id="sync-indicator">🔄 Sincronizzato in diretta con Google Drive</div>

<div class="top-bar">
  <span id="user-status" class="status-badge">Modalità Visitatore (Sola lettura)</span>
  <div id="auth-actions">
    <button id="btn-theme" class="btn-theme" title="Cambia tema chiaro/scuro">🌙</button>
    <button id="btn-login" class="btn-primary">🔐 Accedi con Google per Modificare</button>
    <div id="pin-section" style="display:none;align-items:center;gap:5px;">
      <input type="password" id="input-pin" placeholder="Inserisci PIN" style="padding:7px;width:100px;border-radius:4px;border:1px solid #ccc;">
      <button id="btn-conferma-pin" class="btn-success">Sblocca</button>
    </div>
    <button id="btn-logout" class="btn-danger" style="display:none;">Esci</button>
  </div>
</div>

<div class="filters">
  <div class="chips" id="chips-categorie"></div>
  <div class="search-row">
    <input type="text" id="search-box" placeholder="🔍 Cerca per avversario, es. Roma Volley...">
  </div>
</div>

<div id="admin-panel">
  <h3>➕ Aggiungi Partita</h3>
  <form id="form-aggiungi">
    <div class="form-grid">
      <input type="text" id="nuovo-campionato" placeholder="Campionato (es. Under 19)" list="elenco-campionati" autocomplete="off" required>
      <datalist id="elenco-campionati"></datalist>
      <input type="text" id="nuova-gara" placeholder="N° Gara (es. 249)">
      <input type="text" id="nuovo-giorno" placeholder="Giorno (gg/mm/aaaa)" required>
      <input type="text" id="nuova-ora" placeholder="Ora (es. 17:00)" required>
      <select id="nuovo-luogo">
        <option value="In casa">In casa</option>
        <option value="Fuori casa">Fuori casa</option>
      </select>
      <input type="text" id="nuovo-avversario" placeholder="Avversario" required>
      <input type="text" id="nuova-via" placeholder="Via / Indirizzo palestra">
      <input type="text" id="nuovo-risultato" placeholder="Risultato (opzionale)">
      <button type="submit" class="btn-primary btn-full-width">➕ Salva Partita</button>
    </div>
  </form>
</div>

<div class="matches" id="lista-partite">
  <div class="empty">Caricamento dal Foglio Google in corso...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, browserSessionPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwdCnqiZ3qirg3M1nRDceq9y_VQ83ApOo",
  authDomain: "calendario-fenice.firebaseapp.com",
  projectId: "calendario-fenice",
  storageBucket: "calendario-fenice.firebasestorage.app",
  messagingSenderId: "292051376406",
  appId: "1:292051376406:web:e821eeb0fa377caadc1837"
};

// METTI QUI L'URL DEL NUOVO APPS SCRIPT UNIFICATO (vedi Codice_Apps_Script.gs)
const URL_FOGLIO_GOOGLE = "https://script.google.com/macros/s/AKfycbx8TKyWeg-nShUibPIWvLj9nRcYC-OS8e0lrtLNHjMznUfK9iwiH0UlaErNef-KPC0P/exec";

const EMAIL_VERIFICATE = ["riccardonicchi27@gmail.com", "mariannacoccimiglio@gmail.com"];
const PIN_SEGRETO = "1234";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
setPersistence(auth, browserSessionPersistence);

let emailCorrente = null, isVerificato = false, isSbloccato = false;
let partiteCache = [], ultimoJson = "", rigaInModifica = null;
let categorieSelezionate = new Set(); // vuoto = tutte
let testoRicerca = "";

function escapeHtml(t){return (t||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

// Tema chiaro/scuro con memoria della preferenza (solo su questo dispositivo)
const btnTheme = document.getElementById('btn-theme');
function applicaTema(t){
  if (t === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); btnTheme.textContent = '☀️'; }
  else { document.documentElement.setAttribute('data-theme','light'); btnTheme.textContent = '🌙'; }
}
try{
  const salvato = localStorage.getItem('fenice-tema');
  applicaTema(salvato || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
}catch(e){ applicaTema('light'); }
btnTheme.onclick = () => {
  const attuale = document.documentElement.getAttribute('data-theme');
  const nuovo = attuale === 'dark' ? 'light' : 'dark';
  applicaTema(nuovo);
  try{ localStorage.setItem('fenice-tema', nuovo); }catch(e){}
};

document.getElementById('btn-login').onclick = () => signInWithPopup(auth, provider);
document.getElementById('btn-logout').onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  const statusEl = document.getElementById('user-status');
  const adminPanel = document.getElementById('admin-panel');
  const pinSection = document.getElementById('pin-section');
  const btnLogin = document.getElementById('btn-login');
  const btnLogout = document.getElementById('btn-logout');

  isSbloccato = false; rigaInModifica = null;
  document.getElementById('input-pin').value = '';

  if (user) {
    emailCorrente = user.email.toLowerCase();
    btnLogin.style.display = 'none';
    btnLogout.style.display = 'inline-block';
    adminPanel.style.display = 'none';
    if (EMAIL_VERIFICATE.includes(emailCorrente)) {
      isVerificato = true;
      pinSection.style.display = 'flex';
      statusEl.textContent = `🔒 In attesa di PIN (${emailCorrente})`;
      statusEl.className = "status-badge status-warning";
    } else {
      isVerificato = false;
      pinSection.style.display = 'none';
      statusEl.textContent = `⛔ Non autorizzato (${emailCorrente})`;
      statusEl.className = "status-badge status-unverified";
    }
  } else {
    emailCorrente = null; isVerificato = false;
    btnLogin.style.display = 'inline-block';
    btnLogout.style.display = 'none';
    pinSection.style.display = 'none';
    adminPanel.style.display = 'none';
    statusEl.textContent = "Modalità Visitatore (Sola lettura)";
    statusEl.className = "status-badge";
  }
  disegnaTutto();
});

document.getElementById('btn-conferma-pin').onclick = () => {
  const pinIn = document.getElementById('input-pin').value;
  if (pinIn === PIN_SEGRETO) {
    isSbloccato = true;
    document.getElementById('pin-section').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    const statusEl = document.getElementById('user-status');
    statusEl.textContent = `✅ Sbloccato: ${emailCorrente}`;
    statusEl.className = "status-badge status-verified";
    disegnaTutto();
  } else {
    alert("PIN errato! Riprova.");
    document.getElementById('input-pin').value = '';
  }
};

async function leggiFoglioGoogle(forza=false){
  if (!forza && (rigaInModifica !== null || (document.activeElement && document.activeElement.classList.contains('input-risultato')))) return;
  try{
    const res = await fetch(URL_FOGLIO_GOOGLE + "?t=" + Date.now());
    const dati = await res.json();
    if (dati.status === "ok"){
      const nuovoJson = JSON.stringify(dati.partite);
      if (forza || nuovoJson !== ultimoJson){
        ultimoJson = nuovoJson;
        partiteCache = dati.partite;
        disegnaTutto();
      }
      document.getElementById('sync-indicator').textContent = "✅ In diretta col Foglio Google (ultimo controllo: " + new Date().toLocaleTimeString() + ")";
    }
  }catch(err){ console.error("Errore lettura Foglio Google:", err); }
}

function parseDataOra(giorno, ora){
  const pg = (giorno||"").split("/");
  const po = (ora||"0:0").replace(".",":").split(":");
  if (pg.length !== 3) return new Date(8640000000000000);
  return new Date(parseInt(pg[2]), parseInt(pg[1])-1, parseInt(pg[0]), parseInt(po[0]||0), parseInt(po[1]||0));
}

function disegnaChips(){
  const categorie = [...new Set(partiteCache.map(p => p.Campionato).filter(Boolean))].sort();

  // Suggerimenti per il campo "Campionato" quando aggiungi/modifichi una partita:
  // mostra tutte le categorie già esistenti, ma restano scrivibili (se ne scrivi
  // una nuova, es. "Terza Divisione", viene creata e apparirà una nuova chip).
  const datalist = document.getElementById('elenco-campionati');
  datalist.innerHTML = categorie.map(c => `<option value="${escapeHtml(c)}"></option>`).join('');

  const cont = document.getElementById('chips-categorie');
  cont.innerHTML = "";

  const chipTutte = document.createElement('span');
  chipTutte.className = 'chip chip-all' + (categorieSelezionate.size === 0 ? ' active' : '');
  chipTutte.textContent = 'Tutte';
  chipTutte.onclick = () => { categorieSelezionate.clear(); disegnaTutto(); };
  cont.appendChild(chipTutte);

  categorie.forEach(cat => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (categorieSelezionate.has(cat) ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => {
      if (categorieSelezionate.has(cat)) categorieSelezionate.delete(cat);
      else categorieSelezionate.add(cat);
      disegnaTutto();
    };
    cont.appendChild(chip);
  });
}

function disegnaTutto(){
  disegnaChips();
  disegnaLista();
}

function disegnaLista(){
  const cont = document.getElementById('lista-partite');
  cont.innerHTML = "";

  let elenco = partiteCache.slice();

  if (categorieSelezionate.size > 0){
    elenco = elenco.filter(p => categorieSelezionate.has(p.Campionato));
  }
  if (testoRicerca.trim() !== ""){
    const q = testoRicerca.trim().toLowerCase();
    elenco = elenco.filter(p => (p.Avversario||"").toLowerCase().includes(q));
  }

  elenco.sort((a,b) => parseDataOra(a.Giorno, a.Ora) - parseDataOra(b.Giorno, b.Ora));

  if (elenco.length === 0){
    cont.innerHTML = '<div class="empty">Nessuna partita trovata.</div>';
    return;
  }

  elenco.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.style.animationDelay = (Math.min(idx, 10) * 0.04) + 's';

    if (isVerificato && isSbloccato && rigaInModifica === p.rigaExcel){
      card.innerHTML = `
        <div class="match-top"><span class="camp-tag">${escapeHtml(p.Campionato)}</span> Modifica partita Gara ${escapeHtml(p.Gara)}</div>
        <div class="edit-grid">
          <input type="text" id="edit-camp-${p.rigaExcel}" placeholder="Campionato" list="elenco-campionati" autocomplete="off" value="${escapeHtml(p.Campionato)}">
          <input type="text" id="edit-gara-${p.rigaExcel}" placeholder="N. Gara" value="${escapeHtml(p.Gara)}">
          <input type="text" id="edit-giorno-${p.rigaExcel}" placeholder="gg/mm/aaaa" value="${escapeHtml(p.Giorno)}">
          <input type="text" id="edit-ora-${p.rigaExcel}" placeholder="hh:mm" value="${escapeHtml(p.Ora)}">
          <select id="edit-luogo-${p.rigaExcel}">
            <option value="In casa" ${p.Luogo==='In casa'?'selected':''}>In casa</option>
            <option value="Fuori casa" ${p.Luogo==='Fuori casa'?'selected':''}>Fuori casa</option>
          </select>
          <input type="text" id="edit-avv-${p.rigaExcel}" placeholder="Avversario" value="${escapeHtml(p.Avversario)}">
          <input type="text" id="edit-via-${p.rigaExcel}" placeholder="Via" value="${escapeHtml(p.Via)}">
          <input type="text" id="edit-ris-${p.rigaExcel}" placeholder="Risultato" value="${escapeHtml(p.Risultato)}">
        </div>
        <div class="action-buttons">
          <button class="btn-success" onclick="salvaModificaCompleta(${p.rigaExcel})">💾 Salva</button>
          <button class="btn-danger" onclick="annullaModifica()">❌ Annulla</button>
        </div>`;
      cont.appendChild(card);
      return;
    }

    const casaEAvversario = p.Luogo === 'In casa';
    const squadraCasa = casaEAvversario ? 'FENICE ROMA PALLAVOLO' : p.Avversario;
    const squadraTrasferta = casaEAvversario ? p.Avversario : 'FENICE ROMA PALLAVOLO';
    const ris = (p.Risultato || "").trim();

    let scoreHtml = ris
      ? `<div class="ris">${escapeHtml(ris)}</div>`
      : `<div class="daplay">DA GIOCARE</div>`;

    let adminHtml = '';
    if (isVerificato && isSbloccato){
      adminHtml = `
        <div class="action-buttons">
          <input type="text" class="input-risultato" id="ris-${p.rigaExcel}" value="${escapeHtml(p.Risultato)}" placeholder="es. 3-1">
          <button class="btn-primary" onclick="salvaRisultato(${p.rigaExcel})">💾 Risultato</button>
          <button class="btn-warning" onclick="abilitaModifica(${p.rigaExcel})">✏️ Modifica</button>
          <button class="btn-danger" onclick="eliminaRiga(${p.rigaExcel})">🗑️ Elimina</button>
        </div>`;
    }

    card.innerHTML = `
      <div class="match-top">
        <span><span class="camp-tag">${escapeHtml(p.Campionato)}</span>Gara ${escapeHtml(p.Gara)} · ${escapeHtml(p.Giorno)} · ${escapeHtml(p.Ora)}</span>
      </div>
      <div class="match-body">
        <div class="team casa">${escapeHtml(squadraCasa)}</div>
        <div class="score">${scoreHtml}</div>
        <div class="team trasferta">${escapeHtml(squadraTrasferta)}</div>
      </div>
      <div class="match-bottom">
        <span>📍 ${escapeHtml(p.Luogo)}</span>
        <span class="via">${escapeHtml(p.Via)}</span>
      </div>
      ${adminHtml}
    `;
    cont.appendChild(card);
  });
}

document.getElementById('search-box').addEventListener('input', (e) => {
  testoRicerca = e.target.value;
  disegnaLista();
});

window.abilitaModifica = (r) => { rigaInModifica = r; disegnaLista(); };
window.annullaModifica = () => { rigaInModifica = null; disegnaLista(); };

async function inviaAlFoglio(payload){
  document.getElementById('sync-indicator').textContent = "⏳ Salvataggio in corso...";
  try{
    const req = await fetch(URL_FOGLIO_GOOGLE, { method:"POST", body: JSON.stringify({...payload, email: emailCorrente}) });
    const res = await req.json();
    if (res.status === "errore") alert("Errore dal server Google: " + res.messaggio);
  }catch(err){ alert("Errore di connessione."); console.error(err); }
  await leggiFoglioGoogle(true);
}

window.salvaRisultato = async (r) => {
  const val = document.getElementById(`ris-${r}`).value.trim();
  await inviaAlFoglio({ azione:"aggiorna_risultato", rigaExcel:r, risultato:val });
};

window.eliminaRiga = async (r) => {
  if (!confirm("Eliminare questa partita dal Foglio Google?")) return;
  await inviaAlFoglio({ azione:"elimina_partita", rigaExcel:r });
};

window.salvaModificaCompleta = async (r) => {
  const payload = {
    azione:"modifica_partita_completa", rigaExcel:r,
    Campionato: document.getElementById(`edit-camp-${r}`).value.trim(),
    Gara: document.getElementById(`edit-gara-${r}`).value.trim(),
    Giorno: document.getElementById(`edit-giorno-${r}`).value.trim(),
    Ora: document.getElementById(`edit-ora-${r}`).value.trim(),
    Luogo: document.getElementById(`edit-luogo-${r}`).value,
    Avversario: document.getElementById(`edit-avv-${r}`).value.trim(),
    Via: document.getElementById(`edit-via-${r}`).value.trim(),
    Risultato: document.getElementById(`edit-ris-${r}`).value.trim()
  };
  document.getElementById('sync-indicator').textContent = "⏳ Salvataggio in corso...";
  try{
    const req = await fetch(URL_FOGLIO_GOOGLE, { method:"POST", body: JSON.stringify(payload) });
    const res = await req.json();
    if (res.status === "errore") alert("Errore dal server Google: " + res.messaggio);
    else { rigaInModifica = null; await leggiFoglioGoogle(true); }
  }catch(err){ alert("Errore di connessione."); console.error(err); }
};

document.getElementById('form-aggiungi').addEventListener('submit', async (e) => {
  e.preventDefault();
  await inviaAlFoglio({
    azione:"aggiungi_partita",
    Campionato: document.getElementById('nuovo-campionato').value.trim(),
    Gara: document.getElementById('nuova-gara').value.trim(),
    Giorno: document.getElementById('nuovo-giorno').value.trim(),
    Ora: document.getElementById('nuova-ora').value.trim(),
    Luogo: document.getElementById('nuovo-luogo').value,
    Avversario: document.getElementById('nuovo-avversario').value.trim(),
    Via: document.getElementById('nuova-via').value.trim(),
    Risultato: document.getElementById('nuovo-risultato').value.trim()
  });
  e.target.reset();
});

leggiFoglioGoogle(true);
setInterval(() => leggiFoglioGoogle(false), 5000);
</script>
</body>
